tmux:
    symbols:
        ahead: ↑·
        behind: ↓·
        insertions: "+"
        deletions: "-"

    styles:
        remote: "#[fg=#{@text}]"
        divergence: "#[fg=#bbbbbb]"
        insertions: "#[fg=#{@green}]"
        deletions: "#[fg=#{@red}]"

    layout: [remote, " ", stats]

    options:
        branch_max_len: 0
        branch_trim: right
        ellipsis: …
        hide_clean: true
        swap_divergence: false
        divergence_space: false
        flags_without_count: false
